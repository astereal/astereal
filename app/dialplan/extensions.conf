[globals]
APP_NAME=Astereal
ANI=
DNIS=
START_DATETIME=

; *************************************
; From Internal Context
; Entry context for internal PJSIP endpoints
; *************************************
[from-internal]
include => internal

; *************************************
; Public Inbound Extensions
; Handles initial public inbound routing
; *************************************
[public]
exten => _X.,1,NoOp(*** Welcome to Astereal: Public Inbound ***)
  same => n,Set(START_DATETIME=${EPOCH})
  same => n,Set(ANI=${CALLERID(num)})
  same => n,Set(DNIS=${EXTEN})
  same => n,Verbose("Incoming call from ${ANI} to ${DNIS}")
  same => n,AGI(aster_api.php, "caller/lookup")
  same => n,Verbose("Lookup Result: Status=${AGI_API_STATUS}, Name=${CALLER_NAME}, VIP=${IS_VIP}, Route=${ROUTE_TO}")
  same => n,GotoIf($["${IS_VIP}" = "1"]?vip_route)
  same => n,GotoIf($["${ROUTE_TO}" != "default" & "${ROUTE_TO}" != ""]?custom_route)
  same => n,Dial(PJSIP/${EXTEN},20)
  same => n,Voicemail(${EXTEN}@default,u)
  same => n,Hangup()
  same => n(vip_route),Verbose("Directing VIP Caller ${CALLER_NAME} to VIP Queue/Operator")
  same => n,Dial(PJSIP/100,30)
  same => n,Hangup()
  same => n(custom_route),Verbose("Routing to designated extension: ${ROUTE_TO}")
  same => n,Dial(PJSIP/${ROUTE_TO},25)
  same => n,Hangup()

exten => h,1,NoOp("Always have a hangup in the context.")
  same => n,AGI(aster_logger.php, "Call ended in context: ${CONTEXT}")

; *************************************
; Internal Office Extensions
; Handles internal extension dialing & IVR
; *************************************
[internal]
exten => _X.,1,NoOp(*** Welcome to Astereal: Internal Extensions ***)
  same => n,Set(START_DATETIME=${EPOCH})
  same => n,Set(ANI=${CALLERID(num)})
  same => n,Set(DNIS=${EXTEN})
  same => n,Verbose("Call from ANI:${ANI} to DNIS:${DNIS}")
  same => n,Background(astereal-welcome)
  same => n,Dial(PJSIP/${EXTEN},30)
  same => n,Playback(astereal-welcome)
  same => n,Hangup()

; *************************************
; Operator Transfer Extension
; *************************************
exten => 0,1,NoOp(*** Transfer to Operator ***)
  same => n,Dial(PJSIP/100,20)
  same => n,Hangup()

exten => h,1,NoOp("Always have a hangup in the context.")
  same => n,AGI(aster_logger.php, "Call ended in context: ${CONTEXT}")