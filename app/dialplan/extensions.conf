[globals]
APP_NAME=Astereal
ANI=
DNIS=
START_DATETIME=

; *************************************
; From Internal Context
; Primary entry point for registered PJSIP phones (100-500)
; *************************************
[from-internal]
; Extension-to-extension dialing (100-500)
exten => _[1-5]XX,1,NoOp(*** Internal Call: ${CALLERID(num)} to ${EXTEN} ***)
  same => n,Set(START_DATETIME=${EPOCH})
  same => n,Set(ANI=${CALLERID(num)})
  same => n,Set(DNIS=${EXTEN})
  same => n,Dial(PJSIP/${EXTEN},30)
  same => n,GotoIf($["${DIALSTATUS}" = "BUSY"]?busy:unavail)
  same => n(busy),Playtones(busy)
  same => n,Busy(3)
  same => n,Hangup()
  same => n(unavail),Playtones(congestion)
  same => n,Congestion(3)
  same => n,Hangup()

; Astereal Voice Showcase & Welcome IVR (Dial 1000)
exten => 1000,1,NoOp(*** Astereal Voice Showcase ***)
  same => n,Answer(500)
  same => n,Playback(astereal-welcome)
  same => n,Wait(1)
  same => n,Hangup()

; Built-in Audio Echo Test (Dial *43)
exten => *43,1,NoOp(*** Astereal Audio Echo Test ***)
  same => n,Answer(500)
  same => n,Playback(demo-echotest)
  same => n,Echo()
  same => n,Playback(demo-echodone)
  same => n,Hangup()

; Operator Transfer (Dial 0)
exten => 0,1,NoOp(*** Transfer to Operator ***)
  same => n,Dial(PJSIP/100,30)
  same => n,Hangup()

; Outbound Calling via Trunk (Dial with Prefix 9, e.g. 918005551212)
exten => _9X.,1,NoOp(*** Outbound Call to ${EXTEN:1} via Outgoing Trunk ***)
  same => n,Set(START_DATETIME=${EPOCH})
  same => n,Set(ANI=${CALLERID(num)})
  same => n,Set(DNIS=${EXTEN:1})
  same => n,Dial(PJSIP/${DNIS}@outgoing,60)
  same => n,Hangup()

exten => h,1,NoOp(*** Hangup in from-internal ***)
  same => n,AGI(aster_logger.php, "Call ended in context: ${CONTEXT}")

; *************************************
; Public Inbound Extensions
; External inbound calls play the Astereal welcome voice and route to operator
; *************************************
[public]
exten => _X.,1,NoOp(*** Welcome to Astereal: Public Inbound ***)
  same => n,Set(START_DATETIME=${EPOCH})
  same => n,Set(ANI=${CALLERID(num)})
  same => n,Set(DNIS=${EXTEN})
  same => n,Answer(500)
  same => n,Playback(astereal-welcome)
  same => n,Dial(PJSIP/100,30)
  same => n,Hangup()

exten => s,1,NoOp(*** Public Inbound Catch-all ***)
  same => n,Answer(500)
  same => n,Playback(astereal-welcome)
  same => n,Dial(PJSIP/100,30)
  same => n,Hangup()

exten => h,1,NoOp(*** Hangup in public ***)
  same => n,AGI(aster_logger.php, "Call ended in context: ${CONTEXT}")

; *************************************
; Internal PBX Trunk Context
; Context assigned to the PBX endpoint in pjsip.conf
; *************************************
[internal]
include => from-internal

exten => h,1,NoOp(*** Hangup in internal ***)
  same => n,AGI(aster_logger.php, "Call ended in context: ${CONTEXT}")

; *************************************
; Default Context
; Fallback for unregistered or anonymous SIP traffic
; *************************************
[default]
exten => _X.,1,NoOp(*** Unauthorized Call in Default Context: ${CALLERID(num)} ***)
  same => n,Playtones(congestion)
  same => n,Congestion(5)
  same => n,Hangup()

exten => s,1,NoOp(*** Default Context Catch-all ***)
  same => n,Hangup()

exten => h,1,NoOp(*** Hangup in default ***)
  same => n,AGI(aster_logger.php, "Call ended in context: ${CONTEXT}")