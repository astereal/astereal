; *******************************************************************
; Astereal PJSIP Configuration Template
; Default password for extensions 100-500: 27837325 ('ASTEREAL')
; *******************************************************************

; ===================================================================
; UDP Transport
; ===================================================================
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; ===================================================================
; Basic Endpoint Template (Inherited by internal phones 100-500)
; ===================================================================
[endpoint-basic](!)
type=endpoint
context=from-internal
transport=transport-udp
disallow=all
allow=ulaw,alaw
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[auth-basic](!)
type=auth
auth_type=userpass
password=27837325

[aor-basic](!)
type=aor
max_contacts=1
remove_existing=yes

; ===================================================================
; Internal Extensions (100 - 500)
; ===================================================================
[100](endpoint-basic)
auth=100
aors=100
[100](auth-basic)
username=100
[100](aor-basic)

[200](endpoint-basic)
auth=200
aors=200
[200](auth-basic)
username=200
[200](aor-basic)

[300](endpoint-basic)
auth=300
aors=300
[300](auth-basic)
username=300
[300](aor-basic)

[400](endpoint-basic)
auth=400
aors=400
[400](auth-basic)
username=400
[400](aor-basic)

[500](endpoint-basic)
auth=500
aors=500
[500](auth-basic)
username=500
[500](aor-basic)

; ===================================================================
; Outbound SIP Trunk Template (Used by dialplan prefix 9)
; ===================================================================
[outgoing]
type=endpoint
context=from-internal
transport=transport-udp
disallow=all
allow=ulaw,alaw
aors=outgoing

[outgoing]
type=aor
contact=sip:192.168.1.100:5060 ; Change to your SIP provider or Gateway IP

; ===================================================================
; Anonymous SIP Traffic (Handled by [default] in extensions.conf)
; ===================================================================
[anonymous]
type=endpoint
context=default
disallow=all
allow=ulaw,alaw
