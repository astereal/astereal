[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0

; *******************************************************************
; Note: Default password for endpoints (100-500) is 27837325
; (spells 'ASTEREAL' on a telephone keypad: 2-7-8-3-7-3-2-5)
; *******************************************************************

; --> SIP ACCOUNT FOR 100
[100]
type=endpoint
context=from-internal
transport=transport-udp
disallow=all
allow=ulaw
auth=100
aors=100

[100]
type=auth
auth_type=userpass
password=27837325
username=100

[100]
type=aor
max_contacts=1

