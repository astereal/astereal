; ************************
; OUTGOING ENDPOINT
; ************************
[outgoing]
type=identify
endpoint=outgoing
match=0.0.0.0

[outgoing]
type=endpoint
context=outgoing
disallow=all
allow=ulaw
;rtp_symmetric=yes
force_rport=yes
;rewrite_contact=yes
language=en
aors=outgoing
t38_udptl=yes
t38_udptl_ec=none
;allow_transfer=yes
transport=transport-udp

[outgoing]
type=aor
remove_existing=yes

; ************************
; END OUTGOING ENDPOINT
; ************************

; ************************
; PABX ENDPOINT
; ************************
[pbx]
type=identify
endpoint=pbx
match=0.0.0.0

[pbx]
type=endpoint
context=internal
disallow=all
allow=ulaw
aors=pbx

[pbx]
type=aor
contact=sip:0.0.0.0:5060
; ************************
; END PABX ENDPOINT
; ************************

; ************************
; IDENTIFY ENDPOINT
; ************************
[anonymous]
type=endpoint
context=default
disallow=all
allow=ulaw
; ************************
; END IDENTIFY ENDPOINT
; ************************
