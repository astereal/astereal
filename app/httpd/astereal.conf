# *******************************************************************
# Astereal Framework - Apache VirtualHost Configuration
# Target: /etc/httpd/conf.d/astereal.conf (Rocky Linux / CentOS / RHEL)
# *******************************************************************

<VirtualHost *:80>
    ServerName astereal.local
    ServerAlias localhost *

    # DocumentRoot MUST point strictly to public/
    DocumentRoot /var/www/html/astereal/web/public

    <Directory /var/www/html/astereal/web/public>
        DirectoryIndex index.php index.html
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # Rewrite engine for clean URL routing
        <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteRule ^ index.php [L,QSA]
        </IfModule>
    </Directory>

    # Security: deny direct browser access to sensitive file extensions
    <FilesMatch "\.(env|log|sqlite|conf|sql|md)$">
        Require all denied
    </FilesMatch>

    # Telephony and Web Access Logs
    ErrorLog /var/log/httpd/astereal_error.log
    CustomLog /var/log/httpd/astereal_access.log combined
</VirtualHost>
